[package]
name = "herdr-goal-manager"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Durable goals, evidence, and mixed human/command work in Herdr"
license = "MIT"
repository = "https://github.com/nwiizo/herdr-goal-manager"
readme = "README.md"
keywords = ["herdr", "agents", "goals", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/"]

[[bin]]
name = "hgm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "signal", "net"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }
