name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package $version" >&2
            exit 1
          fi
          name="hgm-${version}-${TARGET}"
          mkdir -p "dist/$name/target/release"
          cp "target/${TARGET}/release/hgm" "dist/$name/target/release/hgm"
          cp README.md LICENSE CHANGELOG.md herdr-plugin.toml "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ARCHIVE=dist/$name.tar.gz" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Smoke test the archive
        shell: bash
        run: |
          mkdir smoke
          tar -C smoke -xzf "$ARCHIVE"
          hgm=(smoke/hgm-*/target/release/hgm)
          test "$("${hgm[0]}" --version)" = "hgm ${VERSION#v}"
          "${hgm[0]}" --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        shell: bash
        run: |
          archives=(hgm-*.tar.gz)
          test "${#archives[@]}" -eq 4
          sha256sum hgm-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/hgm-*.tar.gz dist/SHA256SUMS
          --title "$TAG" --notes-file "docs/releases/$TAG.md" --verify-tag
